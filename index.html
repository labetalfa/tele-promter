<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#07070a" />
  <title>FlowPrompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-head">
    <div class="head-leading">
      <div class="brand" aria-label="FlowPrompter">
        <div class="brand-mark" aria-hidden="true"></div>
        <span>FlowPrompter</span>
      </div>
      <div class="tabs" role="tablist" aria-label="Görünüm">
        <button type="button" role="tab" id="tab-editor" aria-selected="true" data-tab="editor">Editör</button>
        <button type="button" role="tab" id="tab-prompter" aria-selected="false" data-tab="prompter">Kaydır</button>
      </div>
    </div>
    <div class="head-actions">
      <button type="button" class="btn small primary" id="btn-cam-top" aria-pressed="false" title="Kamerayı aç veya kapat" aria-label="Kamerayı aç veya kapat">
        <svg class="head-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <span class="lbl">Kamera</span>
      </button>
      <button type="button" class="btn small ghost" id="btn-flip-cam-head" hidden title="Ön / arka kamera" aria-label="Ön veya arka kameraya geç">
        <svg class="head-ico stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99zM17 13h-8.01v-2H17V8l3.99 4L17 16z"/></svg>
        <span class="lbl flip-lbl">Çevir</span>
      </button>
      <button type="button" class="btn small ghost icon-only" id="btn-rec-top" aria-label="Kayıt başlat veya durdur" aria-pressed="false" hidden title="Kayıt">
        <svg class="head-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>
        <span class="lbl" style="display:none">Kayıt</span>
      </button>
      <button type="button" class="btn small" id="btn-fs" aria-pressed="false" title="Tam ekran (F)" aria-label="Tam ekran">
        <svg class="head-ico stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M21 3v5h-5M3 21h5v-5M16 21h5v-5"/></svg>
        <span class="lbl">Tam ekran</span>
      </button>
    </div>
  </header>

  <div class="app-body">
    <aside class="panel" id="panel-editor" aria-label="Metin düzenleyici">
      <div class="panel-head">
        <h2>Metin</h2>
        <span class="meta" id="stats-desktop">0 kl</span>
      </div>
      <div class="editor">
        <textarea id="textarea-desktop" spellcheck="false" placeholder="Konuşma metninizi buraya yazın…&#10;&#10;İpucu: Boşluk ile oynat/durdur, ok tuşları ile hız ±5."></textarea>
      </div>
    </aside>

    <section class="center" id="stage-column">
      <div class="stage-wrap" id="stage" role="region" aria-label="Teleprompter">
        <div class="cam-backdrop" id="camBackdrop" aria-hidden="true">
          <video id="camVideoBackdrop" muted playsinline autoplay></video>
        </div>
        <div class="cam-scrim" id="camScrim" aria-hidden="true"></div>
        <div class="viewport" id="viewport">
          <div class="mirror-shell" id="mirrorShell">
            <div class="track" id="track">
              <div class="script" id="script"></div>
              <div class="track-trailer" id="trackTrailer" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="blur-fade top" id="blurTop"></div>
        <div class="blur-fade bot" id="blurBot"></div>
        <div class="reading-layer" id="readingLayer">
          <div class="rl-top" id="rlTop"></div>
          <div class="rl-band"><div class="rl-line"></div></div>
          <div class="rl-bot" id="rlBot"></div>
        </div>
        <div class="vignette" id="vignetteEl"></div>
        <div class="countdown" id="countdown" aria-hidden="true"><span id="cdNum">3</span></div>
        <div class="pip" id="pip" hidden>
          <video id="pipVideo" muted playsinline autoplay></video>
          <div class="ph" id="pipPh">Kamera bağlanıyor…</div>
        </div>
        <button type="button" class="cam-switch-fab" id="mob-flip-cam-fab" hidden aria-label="Ön veya arka kamera seç">
          <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99zM17 13h-8.01v-2H17V8l3.99 4L17 16z"/></svg>
          <span class="fab-cap">Ön ↔ Arka</span>
        </button>
        <button type="button" class="fs-exit" id="fs-exit" hidden aria-label="Tam ekrandan çık">Tam ekrandan çık</button>
      </div>

      <div class="transport" id="transport">
        <div class="status-dot" id="statusDot" aria-hidden="true"></div>
        <button type="button" class="play-toggle" id="btn-play" aria-pressed="false" aria-label="Oynat">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button type="button" class="btn small" id="btn-reset" title="Sıfırla (R)">Sıfırla</button>
        <span class="timer" id="elapsed">0:00</span>
        <div class="prog">
          <div class="prog-bar" id="progBar" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="prog-fill" id="progFill"></div>
          </div>
        </div>
        <div class="row" style="gap:8px;flex-wrap:nowrap">
          <span class="meta" style="white-space:nowrap">Hız</span>
          <div class="range-wrap" style="max-width:220px">
            <input type="range" id="speed" min="0" max="100" value="28" aria-label="Kaydırma hızı" />
          </div>
          <span class="val" id="speedVal">28</span>
          <span class="meta" id="wpmEst">~115 wpm</span>
        </div>
      </div>
    </section>

    <aside class="panel" id="panel-settings" aria-label="Ayarlar">
      <div class="panel-head">
        <h2>Ayarlar</h2>
        <span class="meta" id="est-desktop">0:00</span>
      </div>
      <div class="settings-body" id="settings-root"></div>
    </aside>
  </div>

  <nav class="mobile-bar" id="mobileBar" aria-label="Mobil kısayollar">
    <button type="button" data-sheet="editor">
      <svg class="mb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 17h4l2-4 3 6 2-4h5"/><path d="M4 7h16M9 7V5h6v2"/></svg>
      <span>Metin</span>
    </button>
    <button type="button" data-sheet="settings">
      <svg class="mb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 000-2l2-1.5-2-3.5-2.3 1a8 8 0 00-1.7-1L15 2h-6l-.4 3.4a8 8 0 00-1.7 1l-2.3-1-2 3.5L4.6 11a7.9 7.9 0 000 2l-2 1.5 2 3.5 2.3-1a8 8 0 001.7 1L9 22h6l.4-3.4a8 8 0 001.7-1l2.3 1 2-3.5-2-1.5z"/></svg>
      <span>Ayarlar</span>
    </button>
    <button type="button" data-sheet="cam">
      <svg class="mb-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      <span>Kamera</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>

  <div class="sheet" id="sheet-editor" aria-hidden="true" role="dialog" aria-label="Metin editörü">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Metin</div>
    <div class="sheet-body">
      <div class="row" style="margin-bottom:10px">
        <span class="meta" id="stats-mobile">0 kl</span>
      </div>
      <textarea id="textarea-mobile" spellcheck="false" style="width:100%;min-height:46dvh;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--elev)"></textarea>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn primary" data-close-sheet>Tamam</button>
    </div>
  </div>

  <div class="sheet" id="sheet-settings" aria-hidden="true" role="dialog" aria-label="Ayarlar">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Ayarlar</div>
    <div class="sheet-body" id="settings-mobile"></div>
    <div class="sheet-actions">
      <button type="button" class="btn primary" data-close-sheet>Kapat</button>
    </div>
  </div>

  <div class="sheet" id="sheet-cam" aria-hidden="true" role="dialog" aria-label="Kamera">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Kamera</div>
    <div class="sheet-body" id="cam-mobile-body"></div>
    <div class="sheet-actions">
      <button type="button" class="btn primary" data-close-sheet>Kapat</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
