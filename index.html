<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#07070a" />
  <title>FlowPrompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:"DM Sans",system-ui,sans-serif;
      background:var(--shell);color:var(--text);
      display:flex;flex-direction:column;min-height:100dvh;
      overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    }
    :root{
      --shell:#07070a;--panel:#0e0e14;--elev:#14141c;--line:rgba(255,255,255,.08);
      --muted:#8b8698;--text:#f4f1ea;--accent:#e8b84a;--accent-dim:rgba(232,184,74,.15);
      --ok:#3dd68c;--danger:#ff5c5c;--focus-ring:0 0 0 2px var(--panel),0 0 0 4px var(--accent);
      --pad:max(12px, env(safe-area-inset-left));
      --pad-r:max(12px, env(safe-area-inset-right));
      --pad-b:max(10px, env(safe-area-inset-bottom));
      --pad-t:max(8px, env(safe-area-inset-top));
      --r:12px;--r2:16px;--shadow:0 18px 50px rgba(0,0,0,.45);
      --stage-bg:#050508;--stage-fg:#f6f2e8;
      --band:rgba(232,184,74,.14);--band-line:rgba(232,184,74,.65);
      --band-h:clamp(76px, 14vh, 160px);--band-fill-op:.92;--rl-line-h:2px;
      --blur:8px;--vignette:.88;
      --fz:clamp(22px, 2.35vw + 14px, 52px);--lh:1.52;
      --tr:.18s cubic-bezier(.2,.8,.2,1);
    }
    body.theme-amber{--stage-bg:#0a0702;--stage-fg:#ffd48a;--band:rgba(255,212,138,.14);--band-line:rgba(255,212,138,.72)}
    body.theme-studio{--stage-bg:#000;--stage-fg:#fff;--band:rgba(255,255,255,.1);--band-line:rgba(255,255,255,.55)}
    body.theme-light{--stage-bg:#f3efe6;--stage-fg:#16161a;--band:rgba(0,0,0,.06);--band-line:rgba(0,0,0,.28)}
    body.theme-green{--stage-bg:#041008;--stage-fg:#9dffc3;--band:rgba(157,255,195,.14);--band-line:rgba(157,255,195,.62)}
    body.theme-blue{--stage-bg:#040c18;--stage-fg:#9fd4ff;--band:rgba(159,212,255,.14);--band-line:rgba(159,212,255,.62)}
    button,input,textarea,select{font:inherit;color:inherit}

    /* App shell */
    .app-head{
      flex-shrink:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      padding:10px var(--pad-r) 10px var(--pad);border-bottom:1px solid var(--line);
      background:rgba(14,14,20,.94);backdrop-filter:blur(10px);z-index:40;
      min-height:52px;padding-top:max(10px,var(--pad-t));
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;font-size:.95rem}
    .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--accent),#b9821a)}
    .tabs{display:flex;background:var(--elev);padding:4px;border-radius:999px;border:1px solid var(--line);gap:2px}
    .tabs button{
      border:0;border-radius:999px;background:transparent;color:var(--muted);
      padding:7px 14px;font-weight:600;font-size:.82rem;cursor:pointer;transition:color var(--tr),background var(--tr),transform .1s;
    }
    .tabs button[aria-selected="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05)}
    .head-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .head-ico{width:22px;height:22px;flex-shrink:0;display:block;pointer-events:none}
    .head-ico.stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    /* Mobil: ikonları her zaman görünür tut, yazı yerine dokunmatik kare düğme */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:9px 12px;border-radius:10px;border:1px solid var(--line);
      background:var(--elev);color:var(--text);cursor:pointer;font-weight:600;font-size:.82rem;transition:var(--tr);min-height:40px;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn:hover:not(:disabled){border-color:rgba(255,255,255,.18);background:#1a1a24}
    .btn.small{padding:8px 10px;font-size:.78rem;border-radius:8px}
    .btn.primary{background:var(--accent-dim);border-color:rgba(232,184,74,.42);color:var(--accent)}
    .btn.danger-soft{background:rgba(255,92,92,.12);border-color:rgba(255,92,92,.35);color:#ffb4b4}
    .btn.ghost{background:transparent}
    .btn.icon-only{padding:10px;width:42px;height:42px}

    /* Body layout */
    .app-body{display:flex;flex:1;min-height:0;overflow:hidden}
    .panel{
      width:300px;background:var(--panel);flex-shrink:0;display:flex;
      flex-direction:column;border-right:1px solid var(--line);min-width:0;
    }
    .panel:last-of-type{border-right:0;border-left:1px solid var(--line)}
    .panel[hidden]{display:none!important}
    .panel-head{
      padding:12px 14px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;
    }
    .panel-head h2{margin:0;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
    .meta{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--muted)}
    .editor{flex:1;display:flex;flex-direction:column;min-height:0}
    .editor textarea{
      flex:1;border:0;resize:none;padding:14px;background:transparent;color:var(--text);
      line-height:1.55;font-size:.95rem;outline:none;min-height:200px;
    }
    .settings-body{flex:1;overflow:auto;padding:10px 12px 18px;scroll-behavior:smooth}
    .settings-body::-webkit-scrollbar{width:6px}
    .settings-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
    .field{margin-bottom:14px}
    .field > label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
    .range-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
    input[type="range"]{
      -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;
      background:var(--elev);outline:none;cursor:pointer;
    }
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
      background:var(--accent);box-shadow:0 0 0 2px rgba(0,0,0,.35);border:none;
    }
    input[type="range"]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:0}
    .val{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--accent);min-width:48px;text-align:right}
    .chip-group{display:flex;flex-wrap:wrap;gap:6px}
    .chip{
      border:1px solid var(--line);background:var(--elev);border-radius:999px;
      padding:7px 12px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;transition:var(--tr);
    }
    .chip[aria-pressed="true"],.chip.on{background:var(--accent-dim);border-color:rgba(232,184,74,.45);color:var(--accent)}
    select{
      width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
      background:var(--elev);color:var(--text);outline:none;
    }
    select:focus{box-shadow:var(--focus-ring)}
    .theme-dots{display:flex;flex-wrap:wrap;gap:8px}
    .theme-dot{
      width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
    }
    .theme-dot[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
    .td-def{background:#08080c}.td-amber{background:#ffd48a}.td-studio{background:#fff}
    .td-light{background:#f3efe6}.td-green{background:#9dffc3}.td-blue{background:#9fd4ff}

    /* Center column */
    .center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--shell)}
    .stage-wrap{flex:1;position:relative;min-height:0;background:var(--stage-bg);overflow:hidden;touch-action:none}
    .stage-wrap.cam-fill-behind{background:transparent}
    .stage-wrap.playing{cursor:none}
    .viewport{
      position:absolute;inset:0;overflow:hidden;z-index:3;
      background:transparent;
    }
    .mirror-shell{width:100%;min-height:100%;transform-origin:center center;will-change:transform}
    .stage-wrap.mirror-h .mirror-shell{transform:scaleX(-1)}
    .stage-wrap.mirror-v .mirror-shell{transform:scaleY(-1)}
    .stage-wrap.mirror-hv .mirror-shell{transform:scale(-1,-1)}
    .track{
      will-change:transform;transform:translate3d(0,0,0);padding:min(42vh,360px) 8% min(42vh,360px);
    }
    .script{
      font-family:"Fraunces",Georgia,serif;font-size:var(--fz);line-height:var(--lh);
      color:var(--stage-fg);white-space:pre-wrap;word-break:break-word;text-align:left;
      font-variation-settings:"opsz" 72;
    }
    .script strong{font-weight:700}
    .reading-layer{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:7}
    .rl-top,.rl-bot{flex:1;transition:flex-grow .25s ease}
    .rl-band{
      height:var(--band-h);flex-shrink:0;position:relative;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
    }
    .rl-band::before{
      content:"";position:absolute;left:6%;right:6%;top:0;bottom:0;border-radius:14px;
      background:var(--band);border:1px solid var(--band-line);
      opacity:var(--band-fill-op,.92);transition:opacity .2s ease;
    }
    .rl-line{
      position:absolute;left:4%;right:4%;height:var(--rl-line-h, 2px);
      background:var(--band-line);top:50%;transform:translateY(-50%);border-radius:2px;
    }
    .vignette{
      pointer-events:none;position:absolute;inset:0;z-index:5;
      background:linear-gradient(to bottom,var(--stage-bg),transparent 18%,transparent 82%,var(--stage-bg));
      opacity:var(--vignette);transition:opacity .25s ease;
    }
    .blur-fade{
      position:absolute;left:0;right:0;pointer-events:none;z-index:6;
      height:clamp(72px,12vh,200px);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
    }
    .blur-fade.top{top:0;background:linear-gradient(to bottom,var(--stage-bg),transparent);opacity:.9}
    .blur-fade.bot{bottom:0;background:linear-gradient(to top,var(--stage-bg),transparent);opacity:.9}

    body.reduce-motion *,body.reduce-motion *::before{animation:none!important;transition:none!important}

    .cam-backdrop{
      position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;border-radius:inherit;
      opacity:0;transition:opacity .3s ease;
    }
    .cam-backdrop.on{opacity:1}
    .cam-backdrop video{
      position:absolute;width:100%;height:100%;top:50%;left:50%;transform:translate(-50%,-50%);
      object-fit:cover;display:block;background:#000;
    }
    .cam-scrim{
      position:absolute;inset:0;z-index:2;pointer-events:none;
      background:linear-gradient(180deg,rgba(5,5,8,.85) 0%,transparent 25%,transparent 75%,rgba(5,5,8,.85) 100%);
      opacity:0;transition:opacity .25s ease;
    }
    .cam-scrim.on{opacity:1}
    .pip{
      position:absolute;z-index:30;background:#000;border-radius:14px;
      overflow:hidden;border:1px solid rgba(232,184,74,.42);box-shadow:var(--shadow);touch-action:none;
      width:clamp(112px, 26vw, 280px);aspect-ratio:16/9;
      opacity:var(--pip-ui-op, 1);transition:opacity .2s ease, width .2s ease;
    }
    .pip.pip-off{opacity:0;visibility:hidden}
    .pip video{width:100%;height:100%;object-fit:cover;display:block}
    .pip .ph{
      display:flex;align-items:center;justify-content:center;height:100%;font-size:.75rem;color:var(--muted);padding:8px;text-align:center;
    }
    .chip.small-chip{padding:8px;font-size:.9rem;line-height:1;justify-content:center;min-height:40px;border-radius:10px}
    /* Mobil: sahne üstünde kamera ön↔arka (sadece kamera açıkken görünür) */
    .cam-switch-fab{
      display:none;position:absolute;z-index:35;right:max(12px,env(safe-area-inset-right));
      bottom:calc(132px + env(safe-area-inset-bottom));align-items:center;justify-content:center;flex-direction:column;gap:2px;
      width:62px;padding:10px 6px;border-radius:16px;cursor:pointer;
      border:2px solid var(--accent);background:rgba(8,8,12,.92);color:var(--accent);
      box-shadow:0 8px 28px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);touch-action:manipulation;
    }
    .cam-switch-fab svg{width:26px;height:26px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
    .cam-switch-fab .fab-cap{font-size:.58rem;font-weight:700;letter-spacing:.02em;line-height:1;text-align:center;color:var(--text);max-width:100%}

    /* Transport */
    .transport{
      flex-shrink:0;border-top:1px solid var(--line);background:rgba(14,14,20,.96);
      backdrop-filter:blur(14px);padding:10px var(--pad-r) calc(10px + var(--pad-b)) var(--pad);
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    }
    .play-toggle{
      width:52px;height:52px;border-radius:999px;border:1px solid rgba(232,184,74,.5);
      background:linear-gradient(145deg,rgba(232,184,74,.92),#c49222);cursor:pointer;display:grid;
      place-items:center;box-shadow:0 14px 30px rgba(232,184,74,.28);transition:transform .12s ease;
    }
    .play-toggle:active{transform:scale(.96)}
    .play-toggle svg{width:22px;height:22px;fill:#1a1406}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
    .status-dot.running{background:var(--ok);box-shadow:0 0 12px rgba(61,214,140,.7)}
    .status-dot.paused-at{background:var(--accent);box-shadow:0 0 12px rgba(232,184,74,.45)}
    .timer{font-family:"JetBrains Mono",monospace;font-size:.82rem;color:var(--muted);min-width:56px}
    .prog{flex:1;min-width:140px;display:flex;align-items:center;gap:10px}
    .prog-bar{flex:1;height:6px;border-radius:99px;background:var(--elev);position:relative;cursor:pointer;touch-action:none}
    .prog-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#ffe6a3)}

    /* Mobile bar */
    .mobile-bar{
      display:none;border-top:1px solid var(--line);background:var(--panel);
      padding:6px var(--pad-r) calc(6px + var(--pad-b)) var(--pad);gap:6px;justify-content:space-around;
    }
    .mobile-bar button{
      flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;
      align-items:center;gap:4px;padding:8px 4px;border-radius:12px;font-weight:700;font-size:.68rem;letter-spacing:.04em;
    }
    .mobile-bar button[data-active="true"]{color:var(--accent);background:var(--elev)}
    .mobile-bar .mb-ico{width:22px;height:22px;flex-shrink:0;opacity:.9}
    .mobile-bar button[data-active="true"] .mb-ico{opacity:1}

    /* Sheets */
    .sheet-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
      transition:opacity .25s ease;z-index:90;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    }
    .sheet-backdrop.open{opacity:1;pointer-events:auto}
    .sheet{
      position:fixed;left:0;right:0;bottom:0;max-height:86dvh;background:var(--panel);
      border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;
      transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:100;
      display:flex;flex-direction:column;box-shadow:0 -30px 80px rgba(0,0,0,.55);
    }
    .sheet.open{transform:translateY(0)}
    .sheet-handle{width:40px;height:5px;border-radius:99px;background:rgba(255,255,255,.16);margin:10px auto 4px}
    .sheet-title{text-align:center;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:4px 16px 10px}
    .sheet-body{flex:1;overflow:auto;padding:0 14px 18px}
    .sheet-actions{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}

    .countdown{
      position:absolute;inset:0;background:rgba(5,5,8,.78);display:grid;place-items:center;z-index:60;
      opacity:0;pointer-events:none;transition:opacity .25s ease;
    }
    .countdown.on{opacity:1;pointer-events:auto}
    .countdown span{font-size:clamp(72px,18vw,140px);font-weight:800;color:var(--accent);text-shadow:0 0 60px rgba(232,184,74,.45)}

    .toast{
      position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);
      background:var(--elev);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:999px;
      font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:min(92vw,420px);text-align:center;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* Fullscreen */
    :fullscreen .app-head,:fullscreen .panel,:fullscreen .transport,:fullscreen .mobile-bar{display:none!important}
    :-webkit-full-screen .app-head,:-webkit-full-screen .panel,:-webkit-full-screen .transport,:-webkit-full-screen .mobile-bar{display:none!important}

    @media (max-width:900px){
      .panel{width:260px}
    }
    @media (max-width:820px){
      .app-body .panel{display:none!important}
      .mobile-bar{display:flex}
      .transport .meta{display:none}
      .head-actions{margin-left:auto;gap:6px}
      .head-actions .btn .lbl{display:none!important}
      .head-actions .btn{padding:10px;width:48px;height:48px;border-radius:14px;min-height:unset;min-width:unset}
      .head-actions .btn .head-ico{width:24px;height:24px;margin:0}
      .head-actions .btn.small.primary{background:linear-gradient(180deg,#f0cd6a,var(--accent));border:none;color:#1a1406;box-shadow:0 4px 16px rgba(232,184,74,.35)}
      .head-actions .btn.small.primary .head-ico{fill:#1a1406;stroke:none}
      .head-actions .btn.small.ghost{border-color:rgba(232,184,74,.5);background:rgba(232,184,74,.22);color:#f5d78a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
      #btn-fs{background:var(--elev);border-color:rgba(255,255,255,.22);color:#f0ebe0;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
      /* Kayıt: net kırmızı daire ikon */
      #btn-rec-top:not([hidden]){background:rgba(255,92,92,.15);border-color:rgba(255,92,92,.55);color:#ff8a8a}
      /* Yüzen kamera çevir */
      .cam-switch-fab:not([hidden]){display:flex}
      .tabs button{padding:7px 12px;font-size:.78rem}
    }
    @media (max-width:520px){
      .brand span:last-child{display:none}
      .prog{order:10;width:100%}
    }
  </style>
</head>
<body>
  <header class="app-head">
    <div class="brand" aria-label="FlowPrompter">
      <div class="brand-mark" aria-hidden="true"></div>
      <span>FlowPrompter</span>
    </div>
    <div class="tabs" role="tablist" aria-label="Görünüm">
      <button type="button" role="tab" id="tab-editor" aria-selected="true" data-tab="editor">Editör</button>
      <button type="button" role="tab" id="tab-prompter" aria-selected="false" data-tab="prompter">Kaydır</button>
    </div>
    <div class="head-actions">
      <button type="button" class="btn small primary" id="btn-cam-top" aria-pressed="false" title="Kamerayı aç veya kapat" aria-label="Kamerayı aç veya kapat">
        <svg class="head-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <span class="lbl">Kamera</span>
      </button>
      <button type="button" class="btn small ghost" id="btn-flip-cam-head" hidden title="Ön / arka kamera" aria-label="Ön veya arka kameraya geç">
        <svg class="head-ico stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99zM17 13h-8.01v-2H17V8l3.99 4L17 16z"/></svg>
        <span class="lbl flip-lbl">Çevir</span>
      </button>
      <button type="button" class="btn small ghost icon-only" id="btn-rec-top" aria-label="Kayıt başlat veya durdur" aria-pressed="false" hidden title="Kayıt">
        <svg class="head-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>
        <span class="lbl" style="display:none">Kayıt</span>
      </button>
      <button type="button" class="btn small" id="btn-fs" aria-pressed="false" title="Tam ekran (F)" aria-label="Tam ekran">

  <div class="sheet" id="sheet-editor" aria-hidden="true" role="dialog" aria-label="Metin editörü">

    <div class="sheet-actions">
      <button type="button" class="btn primary" data-close-sheet>Kapat</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';

    const $ = (sel, root) => (root || document).querySelector(sel);
    const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

    const prefersReduceMotion = () =>
      window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const LS_KEY = 'flowprompter_v1';


    const state = {
      playing: false,
      countdown: false,
      countdownEnabled: true,
      loop: false,
      speed: 28,
      theme: 'def',
      mirror: 'off',
      bandPos: 'mid',
      blurPx: 8,
      vignette: 0.88,
      fontScale: 1,
      lineHeight: 1.52,
      align: 'left',
      loopRaf: null,
      lastTs: 0,
      pos: 0,
      max: 0,
      elapsedMs: 0,
      manualDrag: false,
      dragStartY: 0,
      dragStartPos: 0,
      facing: 'user',
      camOn: false,
      recOn: false,
      audioOn: true,
      pipCorner: 'tr',
      camLayout: 'pip',
      pipSizePct: 26,
      pipOpacity: 1,
      fillCamOpacity: 0.45,
      fillScrimOpacity: 0.38,
      fillTextGlow: 0.42,
      bandHeightPx: 140,
      lineThicknessPx: 2,
      bandFillOpacity: 0.92,
      stream: null,
      recorder: null,
      chunks: [],
      recordBlob: null,
      saveTimer: null,
      camSwitchBusy: false,
    };

    const els = {
      body: document.body,
      stage: $('#stage'),
      viewport: $('#viewport'),
      track: $('#track'),
      script: $('#script'),
      blurTop: $('#blurTop'),
      blurBot: $('#blurBot'),
      rlTop: $('#rlTop'),
      rlBot: $('#rlBot'),
      vignette: $('#vignetteEl'),
      countdown: $('#countdown'),
      cdNum: $('#cdNum'),
      pip: $('#pip'),
      pipVideo: $('#pipVideo'),
      pipPh: $('#pipPh'),
      camBackdrop: $('#camBackdrop'),
      camVideoBackdrop: $('#camVideoBackdrop'),
      camScrim: $('#camScrim'),
      taD: $('#textarea-desktop'),
      taM: $('#textarea-mobile'),
      statsD: $('#stats-desktop'),
      statsM: $('#stats-mobile'),
      estD: $('#est-desktop'),
      btnPlay: $('#btn-play'),
      btnReset: $('#btn-reset'),
      progBar: $('#progBar'),
      progFill: $('#progFill'),
      elapsed: $('#elapsed'),
      statusDot: $('#statusDot'),
      speed: $('#speed'),
      speedVal: $('#speedVal'),
      wpmEst: $('#wpmEst'),
      sheetBackdrop: $('#sheetBackdrop'),
      sheets: { editor: $('#sheet-editor'), settings: $('#sheet-settings'), cam: $('#sheet-cam') },
      settingsRoot: $('#settings-root'),
      settingsMobile: $('#settings-mobile'),
      camMobile: $('#cam-mobile-body'),
      mobileBar: $('#mobileBar'),
      panelEditor: $('#panel-editor'),
      panelSettings: $('#panel-settings'),
      tabEditor: $('#tab-editor'),
      tabPrompter: $('#tab-prompter'),
      btnCamTop: $('#btn-cam-top'),
      btnFlipHead: $('#btn-flip-cam-head'),
      btnRecTop: $('#btn-rec-top'),
      btnFs: $('#btn-fs'),
      mobFlipFab: $('#mob-flip-cam-fab'),
    };

    function toast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast._tm);
      toast._tm = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function fmtTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function wpmFromSpeed(spd) {
      if (spd <= 0) return 0;
      return Math.round(70 + (spd / 100) * 150);
    }

    function updateMax() {
      state.max = Math.max(0, els.track.scrollHeight - els.viewport.clientHeight);
      updateProgress();
    }

    function applyTransform() {
      const y = -state.pos;
      els.track.style.transform = 'translate3d(0,' + y + 'px,0)';
    }

    function setPos(p, syncUi) {
      state.pos = Math.max(0, Math.min(state.max, p));
      applyTransform();
      if (syncUi !== false) updateProgress();
    }

    function updateProgress() {
      const pct = state.max > 0 ? (state.pos / state.max) * 100 : 0;
      els.progFill.style.width = Math.min(100, pct) + '%';
      els.progBar.setAttribute('aria-valuenow', String(Math.round(pct)));
      els.elapsed.textContent = fmtTime(state.elapsedMs / 1000);
    }

    function setPlayUi(playing) {
      const path = playing
        ? 'M7 5h4v14H7V5zm6 0h4v14h-4V5z'
        : 'M8 5v14l11-7z';
      els.btnPlay.querySelector('path').setAttribute('d', path);
      els.btnPlay.setAttribute('aria-pressed', String(playing));
      els.stage.classList.toggle('playing', playing);
      els.statusDot.className = 'status-dot' + (playing ? ' running' : state.pos > 2 ? ' paused-at' : '');
    }

    function syncText() {
      const v = els.taD.value;
      els.script.textContent = v;
      const words = v.trim() ? v.trim().split(/\s+/).length : 0;
      const stat = words + ' kl · ' + v.length + ' kr';
      els.statsD.textContent = stat;
      els.statsM.textContent = stat;
      const wpm = wpmFromSpeed(state.speed);
      const estSec = wpm > 0 ? Math.round((words / wpm) * 60) : 0;
      const est = fmtTime(estSec);
      els.estD.textContent = est;
      scheduleSave();
      requestAnimationFrame(updateMax);
    }

    function bindTextareas() {
      els.taD.addEventListener('input', () => {
        els.taM.value = els.taD.value;
        syncText();
      });
      els.taM.addEventListener('input', () => {
        els.taD.value = els.taM.value;
        syncText();
      });
    }

    function pause() {
      state.playing = false;
      if (state.loopRaf) cancelAnimationFrame(state.loopRaf);
      state.loopRaf = null;
      state.lastTs = 0;
      setPlayUi(false);
    }

    function tick(ts) {
      if (!state.playing) return;
      if (!state.lastTs) state.lastTs = ts;
      let dt = ts - state.lastTs;
      state.lastTs = ts;
      if (dt > 64) dt = 64;
      if (document.hidden) {
        state.lastTs = 0;
        state.loopRaf = requestAnimationFrame(tick);
        return;
      }
      state.elapsedMs += dt;
      const fs = parseFloat(getComputedStyle(els.script).fontSize) || 24;
      const pxPerSec = (state.speed / 100) * fs * 2.65;
      const delta = (pxPerSec * dt) / 1000;
      if (state.speed <= 0) {
        state.loopRaf = requestAnimationFrame(tick);
        updateProgress();
        return;
      }
      let next = state.pos + delta;
      if (next >= state.max) {
        next = state.max;
        state.pos = next;
        applyTransform();
        updateProgress();
        if (state.loop) {
          state.pos = 0;
          applyTransform();
          state.lastTs = 0;
        } else {
          pause();
          toast('Metin sona erdi');
          return;
        }
      } else {
        state.pos = next;
        applyTransform();
        updateProgress();
      }
      state.loopRaf = requestAnimationFrame(tick);
    }

    function startScroll() {
      if (state.speed <= 0) {
        toast('Hız 0 — kaydırma başlamaz');
        return;
      }
      updateMax();
      state.playing = true;
      state.lastTs = 0;
      setPlayUi(true);
      state.loopRaf = requestAnimationFrame(tick);
    }

    function runCountdown() {
      if (prefersReduceMotion()) {
        startScroll();
        return;
      }
      state.countdown = true;
      els.countdown.classList.add('on');
      let n = 3;
      els.cdNum.textContent = String(n);
      const step = () => {
        n--;
        if (n <= 0) {
          els.countdown.classList.remove('on');
          state.countdown = false;
          startScroll();
        } else {
          els.cdNum.textContent = String(n);
          setTimeout(step, 900);
        }
      };
      setTimeout(step, 900);
    }

    function togglePlay() {
      if (state.countdown) return;
      if (state.playing) {
        pause();
        return;
      }
      if (state.countdownEnabled && state.pos < 1) runCountdown();
      else startScroll();
    }

    function resetPlay() {
      pause();
      if (state.countdown) {
        state.countdown = false;
        els.countdown.classList.remove('on');
      }
      state.pos = 0;
      state.elapsedMs = 0;
      applyTransform();
      updateProgress();
    }

    function seekClientX(clientX) {
      const r = els.progBar.getBoundingClientRect();
      const w = r.width || 1;
      const t = Math.max(0, Math.min(1, (clientX - r.left) / w));
      setPos(t * state.max);
    }

    function applyFocusChrome() {
      const h = Math.max(56, Math.min(260, state.bandHeightPx));
      const th = Math.max(1, Math.min(12, state.lineThicknessPx));
      document.documentElement.style.setProperty('--band-h', 'clamp(52px, ' + h + 'px, 280px)');
      document.documentElement.style.setProperty('--rl-line-h', th + 'px');
      document.documentElement.style.setProperty('--band-fill-op', String(state.bandFillOpacity));
    }

    function applyFillGlow() {
      const active = state.camOn && state.camLayout === 'fill';
      const g = Math.max(0, Math.min(1, state.fillTextGlow));
      if (active && g > 0.04) {
        const spread = Math.round(6 + g * 28);
        const a = Math.min(0.82, 0.2 + g * 0.55);
        els.script.style.textShadow = '0 0.06em .12em rgba(0,0,0,' + Math.min(.95, a + .15) + '), 0 .12em ' + spread + 'px rgba(0,0,0,' + a + ')';
      } else {
        els.script.style.textShadow = 'none';
      }
    }

    function syncCamPanelsFromState() {
      const layouts = '[data-cam-layout]';
      const keys = ['pip-size', 'pip-op', 'fill-vid-op', 'fill-scrim', 'fill-glow'];
      [els.settingsRoot, els.settingsMobile, els.camMobile].forEach((panel) => {
        if (!panel) return;
        const box = panel.querySelector('.js-cam-settings');
        if (!box) return;
        box.querySelectorAll(layouts).forEach((b) => {
          const on = b.dataset.camLayout === state.camLayout;
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', String(on));
        });
        const pipOpts = box.querySelector('.cam-pip-opts');
        const fillOpts = box.querySelector('.cam-fill-opts');
        if (pipOpts) pipOpts.hidden = state.camLayout === 'fill';
        if (fillOpts) fillOpts.hidden = state.camLayout !== 'fill';
        keys.forEach((k) => {
          const inp = box.querySelector('[data-k="' + k + '"]');
          const lab = box.querySelector('[data-v="' + k + '"]');
          if (!inp) return;
          if (k === 'pip-size') {
            inp.value = String(Math.round(state.pipSizePct));
            if (lab) lab.textContent = Math.round(state.pipSizePct) + '%';
          } else if (k === 'pip-op') {
            inp.value = String(Math.round(state.pipOpacity * 100));
            if (lab) lab.textContent = Math.round(state.pipOpacity * 100) + '%';
          } else if (k === 'fill-vid-op') {
            inp.value = String(Math.round(state.fillCamOpacity * 100));
            if (lab) lab.textContent = Math.round(state.fillCamOpacity * 100) + '%';
          } else if (k === 'fill-scrim') {
            inp.value = String(Math.round(state.fillScrimOpacity * 100));
            if (lab) lab.textContent = Math.round(state.fillScrimOpacity * 100) + '%';
          } else if (k === 'fill-glow') {
            inp.value = String(Math.round(state.fillTextGlow * 100));
            if (lab) lab.textContent = Math.round(state.fillTextGlow * 100) + '%';
          }
        });
        box.querySelectorAll('[data-pip-pos]').forEach((b) => {
          b.classList.toggle('on', b.dataset.pipPos === state.pipCorner);
        });
        box.querySelectorAll('[data-facing]').forEach((b) => {
          const on = b.dataset.facing === state.facing;
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', String(on));
        });
      });
    }

    function updateCamFlipHeadUi() {
      const tip = state.facing === 'user' ? 'Arka kameraya geç' : 'Ön (selfie) kameraya geç';
      const shortNext = state.facing === 'user' ? 'Arkaya geç' : 'Öne geç';
      const show = state.camOn;
      if (els.btnFlipHead) {
        els.btnFlipHead.hidden = !show;
        const lbl = els.btnFlipHead.querySelector('.flip-lbl');
        if (lbl) lbl.textContent = shortNext;
        els.btnFlipHead.title = tip;
        els.btnFlipHead.setAttribute('aria-label', tip);
      }
      if (els.mobFlipFab) {
        els.mobFlipFab.hidden = !show;
        const cap = els.mobFlipFab.querySelector('.fab-cap');
        if (cap) cap.textContent = shortNext;
        els.mobFlipFab.title = tip;
        els.mobFlipFab.setAttribute('aria-label', tip);
      }
    }

    function setCamLayout(layout) {
      state.camLayout = layout === 'fill' ? 'fill' : 'pip';
      syncCamPanelsFromState();
      applyCamVisuals();
      scheduleSave();
    }

    function applyCamVisuals() {
      const fillActive = state.camOn && state.camLayout === 'fill';
      els.pip.classList.toggle('pip-off', !state.camOn || fillActive);
      els.stage.style.setProperty('--pip-ui-op', String(state.pipOpacity));
      els.pip.style.width = state.pipSizePct + '%';
      els.camVideoBackdrop.style.opacity = String(state.fillCamOpacity);
      els.camScrim.style.opacity = fillActive ? String(state.fillScrimOpacity) : '0';
      els.camBackdrop.style.visibility = fillActive ? 'visible' : 'hidden';
      els.camBackdrop.classList.toggle('on', fillActive);
      els.camScrim.classList.toggle('on', fillActive && state.fillScrimOpacity > 0.02);
      els.stage.classList.toggle('cam-fill-behind', fillActive);
      applyFillGlow();
      placePip(state.pipCorner);
    }

    function onDelegatedCamChange(ev) {
      const inp = ev.target;
      if (!(inp instanceof HTMLInputElement)) return;
      if (!inp.closest('.js-cam-settings') || !inp.dataset.k) return;
      const k = inp.dataset.k;
      const v = parseFloat(inp.value);
      if (k === 'pip-size') {
        state.pipSizePct = Math.max(15, Math.min(48, Math.round(v)));
      } else if (k === 'pip-op') {
        state.pipOpacity = Math.max(0.2, Math.min(1, v / 100));
      } else if (k === 'fill-vid-op') {
        state.fillCamOpacity = Math.max(0.08, Math.min(1, v / 100));
      } else if (k === 'fill-scrim') {
        state.fillScrimOpacity = Math.max(0, Math.min(0.94, v / 100));
      } else if (k === 'fill-glow') {
        state.fillTextGlow = Math.max(0, Math.min(1, v / 100));
      } else return;
      syncCamPanelsFromState();
      applyCamVisuals();
      scheduleSave();
    }

    function onDelegatedCamClick(ev) {
      const ly = ev.target.closest('[data-cam-layout]');
      if (ly && ly.closest('.js-cam-settings')) {
        ev.preventDefault();
        setCamLayout(ly.dataset.camLayout);
        return;
      }
      const pos = ev.target.closest('[data-pip-pos]');
      if (pos && pos.closest('.js-cam-settings')) {
        state.pipCorner = pos.dataset.pipPos;
        [els.settingsRoot, els.settingsMobile, els.camMobile].forEach((panel) => {
          if (!panel) return;
          const bx = panel.querySelector('.js-cam-settings');
          if (!bx) return;
          bx.querySelectorAll('[data-pip-pos]').forEach((b) =>
            b.classList.toggle('on', b.dataset.pipPos === state.pipCorner),
          );
        });
        placePip(state.pipCorner);
        scheduleSave();
        return;
      }
      const faceBtn = ev.target.closest('[data-facing]');
      if (faceBtn && faceBtn.closest('.js-cam-settings')) {
        ev.preventDefault();
        void switchCameraFacing(faceBtn.dataset.facing);
      }
    }

    function wireCamDelegation() {
      [els.settingsRoot, els.settingsMobile, els.camMobile].forEach((par) => {
        if (!par || par.dataset.camWire) return;
        par.dataset.camWire = '1';
        par.addEventListener('input', onDelegatedCamChange);
        par.addEventListener('click', onDelegatedCamClick);
      });
    }

    function buildSettings(html) {
      els.settingsRoot.innerHTML = html;
      els.settingsMobile.innerHTML = html;
    }

    function initSettingsUi() {
      const html = `
        <div class="field">

    function wireSettingsPanels(root) {
      root.querySelector('[data-action="toggle-cd"]').addEventListener('click', (e) => {
        state.countdownEnabled = !state.countdownEnabled;
        e.currentTarget.setAttribute('aria-pressed', String(state.countdownEnabled));
        e.currentTarget.textContent = state.countdownEnabled ? 'Açık' : 'Kapalı';
        mirrorChip(root, e.currentTarget);
        scheduleSave();
      });
      root.querySelector('[data-action="toggle-loop"]').addEventListener('click', (e) => {
        state.loop = !state.loop;
        e.currentTarget.setAttribute('aria-pressed', String(state.loop));
        e.currentTarget.textContent = state.loop ? 'Açık' : 'Kapalı';
        e.currentTarget.classList.toggle('on', state.loop);
        mirrorChip(root, e.currentTarget);
        scheduleSave();
      });

      const fontR = root.querySelector('[data-k="font"]');
      const lhR = root.querySelector('[data-k="lh"]');
      const blurR = root.querySelector('[data-k="blur"]');
      const vigR = root.querySelector('[data-k="vig"]');
      const face = root.querySelector('[data-k="face"]');

      const bindRange = (input, fmt, apply) => {
        input.addEventListener('input', () => {
          const v = parseFloat(input.value);
          root.querySelector('[data-v="' + input.dataset.k + '"]').textContent = fmt(v);
          apply(v);
          syncParallelRange(input);
          scheduleSave();
        });
      };

      bindRange(fontR, (v) => Math.round(v * 100) + '%', (v) => {
        state.fontScale = v;
        document.documentElement.style.setProperty('--fz', 'calc(' + v + ' * clamp(22px, 2.35vw + 14px, 52px))');
        updateMax();
      });
      bindRange(lhR, (v) => v.toFixed(2), (v) => {
        state.lineHeight = v;
        els.script.style.lineHeight = String(v);
        updateMax();
      });
      bindRange(blurR, (v) => v + 'px', (v) => {
        state.blurPx = v;
        document.documentElement.style.setProperty('--blur', v + 'px');
      });
      bindRange(vigR, (v) => Math.round(v) + '%', (v) => {
        state.vignette = v / 100;
        els.vignette.style.opacity = String(v / 100);
      });

      const bandHpx = root.querySelector('[data-k="band-hpx"]');
      const lineTh = root.querySelector('[data-k="line-th"]');
      const bandOp = root.querySelector('[data-k="band-op"]');
      if (bandHpx) {
        bindRange(bandHpx, (v) => Math.round(v) + 'px', (v) => {
          state.bandHeightPx = v;
          applyFocusChrome();
        });
      }
      if (lineTh) {
        bindRange(lineTh, (v) => (Math.round(v * 2) / 2).toFixed(1).replace(/\.0$/, '') + 'px', (v) => {
          state.lineThicknessPx = v;
          applyFocusChrome();
        });
      }
      if (bandOp) {
        bindRange(bandOp, (v) => Math.round(v) + '%', (v) => {
          state.bandFillOpacity = Math.max(0.06, Math.min(1, v / 100));
          applyFocusChrome();
        });
      }

      face.addEventListener('change', () => {
        const map = { fr: '"Fraunces",Georgia,serif', dm: '"DM Sans",system-ui,sans-serif', mono: '"JetBrains Mono",monospace' };
        els.script.style.fontFamily = map[face.value] || map.fr;
        syncParallelSelect(face);
        scheduleSave();
      });

      root.querySelectorAll('[data-align]').forEach((b) => {
        b.addEventListener('click', () => {
          root.querySelectorAll('[data-align]').forEach((x) => x.classList.remove('on'));
          b.classList.add('on');
          els.script.style.textAlign = b.dataset.align;
          mirrorAlign(root, b.dataset.align);
          scheduleSave();
        });
      });

      root.querySelectorAll('[data-band]').forEach((b) => {
        b.addEventListener('click', () => {
          setBand(b.dataset.band, root);
          scheduleSave();
        });
      });

      root.querySelectorAll('[data-mirror]').forEach((b) => {
        b.addEventListener('click', () => setMirror(b.dataset.mirror, root));
      });

      root.querySelectorAll('[data-theme]').forEach((b) => {
        b.addEventListener('click', () => setTheme(b.dataset.theme, root));
      });
    }

    function mirrorChip(root, el) {
      const action = el.getAttribute('data-action');
      const panels = [els.settingsRoot, els.settingsMobile];
      panels.forEach((p) => {
        if (p === root) return;
        const o = p.querySelector('[data-action="' + action + '"]');
        if (!o) return;
        o.setAttribute('aria-pressed', el.getAttribute('aria-pressed'));
        o.textContent = el.textContent;
        o.classList.toggle('on', el.classList.contains('on'));
      });
    }

    function mirrorAlign(root, al) {
      [els.settingsRoot, els.settingsMobile].forEach((p) => {
        if (p === root) return;
        p.querySelectorAll('[data-align]').forEach((x) => x.classList.toggle('on', x.dataset.align === al));
      });
    }

    function syncParallelRange(input) {
      const k = input.dataset.k;
      const v = input.value;
      [els.settingsRoot, els.settingsMobile].forEach((p) => {
        const o = p.querySelector('[data-k="' + k + '"]');
        if (o && o !== input) {
          o.value = v;
          const lab = p.querySelector('[data-v="' + k + '"]');
          if (lab) {
            if (k === 'font') lab.textContent = Math.round(parseFloat(v) * 100) + '%';
            else if (k === 'lh') lab.textContent = parseFloat(v).toFixed(2);
            else if (k === 'blur') lab.textContent = parseFloat(v) + 'px';
            else if (k === 'vig') lab.textContent = Math.round(parseFloat(v)) + '%';
            else if (k === 'band-hpx') lab.textContent = Math.round(parseFloat(v)) + 'px';
            else if (k === 'line-th') {
              const nv = Math.round(parseFloat(v) * 2) / 2;
              lab.textContent = (nv % 1 ? nv.toFixed(1) : nv) + 'px';
            }
            else if (k === 'band-op') lab.textContent = Math.round(parseFloat(v)) + '%';
          }
        }
      });
    }

    function syncParallelSelect(sel) {
      const v = sel.value;
      [els.settingsRoot, els.settingsMobile].forEach((p) => {
        const o = p.querySelector('[data-k="face"]');
        if (o && o !== sel) o.value = v;
      });
    }

    function setBand(pos, root) {
      state.bandPos = pos;
      const map = { top: [0.35, 2.2], mid: [1, 1], bot: [2.2, 0.35] };
      const g = map[pos] || map.mid;
      els.rlTop.style.flexGrow = String(g[0]);
      els.rlBot.style.flexGrow = String(g[1]);
      [els.settingsRoot, els.settingsMobile].forEach((p) => {
        p.querySelectorAll('[data-band]').forEach((b) => b.classList.toggle('on', b.dataset.band === pos));
      });
    }

    function setMirror(m, root) {
      state.mirror = m;
      els.stage.classList.remove('mirror-h', 'mirror-v', 'mirror-hv');
      if (m === 'h') els.stage.classList.add('mirror-h');
      else if (m === 'v') els.stage.classList.add('mirror-v');
      else if (m === 'hv') els.stage.classList.add('mirror-hv');
      [els.settingsRoot, els.settingsMobile].forEach((p) => {
        p.querySelectorAll('[data-mirror]').forEach((b) => b.classList.toggle('on', b.dataset.mirror === m));
      });
      scheduleSave();
    }

    function setTheme(t, root) {
      state.theme = t;
      els.body.className = els.body.className.replace(/\btheme-\w+/g, '').trim();
      if (t !== 'def') els.body.classList.add('theme-' + (t === 'studio' ? 'studio' : t === 'light' ? 'light' : t));
      [els.settingsRoot, els.settingsMobile].forEach((p) => {
        p.querySelectorAll('[data-theme]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.theme === t)));
      });
      scheduleSave();
    }

    function updateWpmLabel() {
      const w = wpmFromSpeed(state.speed);
      els.speedVal.textContent = String(Math.round(state.speed));
      els.wpmEst.textContent = w ? '~' + w + ' wpm' : '—';
      $$('.js-est').forEach((estEl) => {
        const words = els.taD.value.trim() ? els.taD.value.trim().split(/\s+/).length : 0;
        const sec = w > 0 ? Math.round((words / w) * 60) : 0;
        estEl.textContent = fmtTime(sec) + ' tahmini';
      });
    }

    function openSheet(name) {
      const sh = els.sheets[name];
      if (!sh) return;
      els.sheetBackdrop.hidden = false;
      requestAnimationFrame(() => els.sheetBackdrop.classList.add('open'));
      sh.classList.add('open');
      sh.setAttribute('aria-hidden', 'false');
      $$('.mobile-bar button').forEach((b) => b.setAttribute('data-active', String(b.dataset.sheet === name)));
    }

    function closeSheets() {
      els.sheetBackdrop.classList.remove('open');
      setTimeout(() => { els.sheetBackdrop.hidden = true; }, 220);
      Object.values(els.sheets).forEach((sh) => {
        sh.classList.remove('open');
        sh.setAttribute('aria-hidden', 'true');
      });
      $$('.mobile-bar button').forEach((b) => b.removeAttribute('data-active'));
    }

    function applyTab(mode) {
      const ed = mode === 'editor';
      els.tabEditor.setAttribute('aria-selected', String(ed));
      els.tabPrompter.setAttribute('aria-selected', String(!ed));
      if (window.matchMedia('(max-width:820px)').matches) {
        if (ed) openSheet('editor');
        else closeSheets();
      } else {
        els.panelEditor.hidden = !ed;
        els.panelSettings.hidden = false;
      }
      requestAnimationFrame(updateMax);
    }

    async function toggleCam() {
      if (state.camOn) return stopCam();
      els.pip.hidden = false;
      els.camBackdrop.style.visibility = 'hidden';
      els.pipPh.style.display = 'flex';
      els.pipVideo.style.display = 'none';
      els.camVideoBackdrop.style.display = 'block';
      try {
        const s = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: state.facing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: state.audioOn,
        });
        state.stream = s;
        state.camOn = true;
        els.pipVideo.srcObject = s;
        els.camVideoBackdrop.srcObject = s;
        await Promise.all([
          els.pipVideo.play().catch(() => {}),
          els.camVideoBackdrop.play().catch(() => {}),
        ]);
        els.pipPh.style.display = 'none';
        els.pipVideo.style.display = 'block';
        els.btnCamTop.setAttribute('aria-pressed', 'true');
        els.btnRecTop.hidden = false;
        syncCamPanelsFromState();
        applyCamVisuals();
        updateCamFlipHeadUi();
        toast('Kamera hazır');
      } catch (e) {
        els.pip.hidden = true;
        els.camVideoBackdrop.srcObject = null;
        state.camOn = false;
        updateCamFlipHeadUi();
        toast('Kamera izni gerekli');
      }
      buildCamPanel();
      scheduleSave();
    }

    function stopCam() {
      if (state.recOn) stopRec();
      if (state.stream) {
        state.stream.getTracks().forEach((t) => t.stop());
        state.stream = null;
      }
      els.pipVideo.srcObject = null;
      els.camVideoBackdrop.srcObject = null;
      state.camOn = false;
      els.pip.hidden = true;
      els.btnCamTop.setAttribute('aria-pressed', 'false');
      els.btnRecTop.hidden = true;
      updateCamFlipHeadUi();
      applyCamVisuals();
      buildCamPanel();
      scheduleSave();
    }

    function buildCamPanel() {
      const html =
        `
        <div class="field">
          <button type="button" class="btn primary" style="width:100%;margin-bottom:8px" data-cam-toggle>Kamerayı ${state.camOn ? 'kapat' : 'aç'}</button>
          <button type="button" class="btn danger-soft" style="width:100%;margin-bottom:16px;display:${state.camOn ? 'flex' : 'none'}" data-rec-toggle>${state.recOn ? 'Kaydı durdur' : 'Kayıt başlat'}</button>
          <button type="button" class="chip${state.audioOn ? ' on' : ''}" style="width:100%;margin-bottom:4px" data-audio>${state.audioOn ? 'Kayıtta ses açık' : 'Kayıtta ses kapalı'}</button>
          <p class="meta" style="line-height:1.45;margin:8px 0 0;font-size:.7rem">Ön/arka seçimi aşağıdaki &quot;Kamera görünümü&quot; bloğundadır.</p>
        </div>
        `;
      els.camMobile.innerHTML = html;
      const srcBlk = $('.js-cam-settings', els.settingsRoot);
      if (srcBlk) els.camMobile.appendChild(srcBlk.cloneNode(true));
      els.camMobile.querySelector('[data-cam-toggle]').addEventListener('click', () => toggleCam());
      const recBtn = els.camMobile.querySelector('[data-rec-toggle]');
      if (recBtn) recBtn.addEventListener('click', () => toggleRec());
      els.camMobile.querySelector('[data-audio]').addEventListener('click', (e) => {
        state.audioOn = !state.audioOn;
        e.currentTarget.textContent = state.audioOn ? 'Kayıtta ses açık' : 'Kayıtta ses kapalı';
        e.currentTarget.classList.toggle('on', state.audioOn);
        if (state.stream) state.stream.getAudioTracks().forEach((t) => (t.enabled = state.audioOn));
        scheduleSave();
      });
      syncCamPanelsFromState();
    }

    function placePip(corner) {
      const pad = 12;
      const p = els.pip.style;
      p.top = p.bottom = p.left = p.right = 'auto';
      p.margin = '';
      p.transform = '';
      switch (corner) {
        case 'tl':
          p.top = pad + 'px';
          p.left = pad + 'px';
          break;
        case 'tr':
          p.top = pad + 'px';
          p.right = pad + 'px';
          break;
        case 'bl':
          p.bottom = pad + 'px';
          p.left = pad + 'px';
          break;
        case 'br':
          p.bottom = pad + 'px';
          p.right = pad + 'px';
          break;
        case 'tc':
          p.top = pad + 'px';
          p.left = '50%';
          p.transform = 'translateX(-50%)';
          break;
        case 'bc':
          p.bottom = pad + 'px';
          p.left = '50%';
          p.transform = 'translateX(-50%)';
          break;
        case 'ml':
          p.top = '50%';
          p.left = pad + 'px';
          p.marginTop = ''; // Safari
          p.transform = 'translateY(-50%)';
          break;
        case 'mr':
          p.top = '50%';
          p.right = pad + 'px';
          p.transform = 'translateY(-50%)';
          break;
        case 'cc':
        default:
          p.top = '50%';
          p.left = '50%';
          p.transform = 'translate(-50%,-50%)';
          break;
      }
    }

    /**
     * MediaRecorder.stop asenkron: hemen ardından getUserMedia (özellikle mobil)
     * bazen yarış yapıyor. Kamera çevirmeden önce kaydı sessiz bitirip inactive bekliyoruz.
     */
    function waitRecorderSilentlyDetached() {
      state.recOn = false;
      els.btnRecTop.setAttribute('aria-pressed', 'false');
      const rec = state.recorder;
      if (!rec || rec.state === 'inactive') {
        state.recorder = null;
        return Promise.resolve();
      }
      return new Promise((resolve) => {
        const finish = () => {
          state.recorder = null;
          resolve();
        };
        try {
          rec.ondataavailable = null;
          rec.onstop = finish;
          rec.stop();
        } catch (_) {
          finish();
        }
      });
    }

    async function switchCameraFacing(nextFacing) {
      if (nextFacing !== 'user' && nextFacing !== 'environment') return;
      if (state.facing === nextFacing) return;
      if (state.camSwitchBusy) {
        toast('Kamera geçişi sürüyor…');
        return;
      }
      const prevFacing = state.facing;
      state.facing = nextFacing;
      syncCamPanelsFromState();
      scheduleSave();
      if (!state.camOn) {
        updateCamFlipHeadUi();
        return;
      }
      state.camSwitchBusy = true;
      const resumeRecording = state.recOn;
      try {
        if (resumeRecording) await waitRecorderSilentlyDetached();
        const s = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: state.facing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: state.audioOn,
        });
        if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
        state.stream = s;
        els.pipVideo.srcObject = s;
        els.camVideoBackdrop.srcObject = s;
        await Promise.all([
          els.pipVideo.play().catch(() => {}),
          els.camVideoBackdrop.play().catch(() => {}),
        ]);
        const camLabel = state.facing === 'user' ? 'Ön kamera' : 'Arka kamera';
        if (resumeRecording) startRec();
        if (resumeRecording && state.recOn) toast(camLabel + ' — kayıt sürüyor');
        else if (!resumeRecording) toast(camLabel);
        else toast(camLabel);
      } catch (e) {
        state.facing = prevFacing;
        syncCamPanelsFromState();
        scheduleSave();
        toast('Bu kamera seçilemedi veya izin yok');
        if (resumeRecording && state.stream && state.camOn) startRec();
      } finally {
        state.camSwitchBusy = false;
        syncCamPanelsFromState();
        buildCamPanel();
        updateCamFlipHeadUi();
      }
    }

    async function flipCam() {
      return switchCameraFacing(state.facing === 'user' ? 'environment' : 'user');
    }

    function toggleRec() {
      state.recOn ? stopRec() : startRec();
    }

    function startRec() {
      if (!state.stream || !window.MediaRecorder) {
        toast('Kayıt desteklenmiyor');
        return;
      }
      state.chunks = [];
      state.recordBlob = null;
      const types = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'];
      let mime = types.find((t) => MediaRecorder.isTypeSupported(t)) || '';
      try {
        state.recorder = new MediaRecorder(state.stream, mime ? { mimeType: mime } : undefined);
      } catch (e) {
        toast('Kayıt başlatılamadı');
        return;
      }
      state.recorder.ondataavailable = (e) => {
        if (e.data.size) state.chunks.push(e.data);
      };
      state.recorder.onstop = () => {
        state.recordBlob = new Blob(state.chunks, { type: mime || 'video/webm' });
        downloadBlob(state.recordBlob);
        toast('Kayıt indirildi');
      };
      state.recorder.start(200);
      state.recOn = true;
      els.btnRecTop.setAttribute('aria-pressed', 'true');
      syncCamPanelsFromState();
      buildCamPanel();
    }

    function stopRec() {
      if (state.recorder && state.recorder.state !== 'inactive') state.recorder.stop();
      state.recOn = false;
      els.btnRecTop.setAttribute('aria-pressed', 'false');
      buildCamPanel();
    }

    function downloadBlob(blob) {
      const u = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = u;
      a.download = 'flowprompter-' + new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-') + '.webm';
      a.click();
      setTimeout(() => URL.revokeObjectURL(u), 4000);
    }

    function goFullscreen() {
      const el = document.documentElement;
      const fs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!fs) {
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) req.call(el);
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      }
    }

    function scheduleSave() {
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(savePrefs, 350);
    }

    function savePrefs() {
      try {
        const dFace = els.settingsRoot.querySelector('[data-k="face"]');
        const payload = {
          text: els.taD.value,
          speed: state.speed,
          theme: state.theme,
          mirror: state.mirror,
          band: state.bandPos,
          countdown: state.countdownEnabled,
          loop: state.loop,
          font: state.fontScale,
          lh: state.lineHeight,
          blur: state.blurPx,
          vig: state.vignette,
          align: els.script.style.textAlign || 'left',
          face: dFace ? dFace.value : 'fr',
          pip: state.pipCorner,
          facing: state.facing,
          audio: state.audioOn,
          camLayout: state.camLayout,
          pipSizePct: state.pipSizePct,
          pipOpacity: state.pipOpacity,
          fillCamOpacity: state.fillCamOpacity,
          fillScrimOpacity: state.fillScrimOpacity,
          fillTextGlow: state.fillTextGlow,
          bandHeightPx: state.bandHeightPx,
          lineThicknessPx: state.lineThicknessPx,
          bandFillOpacity: state.bandFillOpacity,
        };
        localStorage.setItem(LS_KEY, JSON.stringify(payload));
      } catch (e) {}
    }

    function syncPlaybackToggles() {
      [els.settingsRoot, els.settingsMobile].forEach((p) => {
        const cd = p.querySelector('[data-action="toggle-cd"]');
        if (cd) {
          cd.setAttribute('aria-pressed', String(state.countdownEnabled));
          cd.textContent = state.countdownEnabled ? 'Açık' : 'Kapalı';
        }
        const lp = p.querySelector('[data-action="toggle-loop"]');
        if (lp) {
          lp.setAttribute('aria-pressed', String(state.loop));
          lp.textContent = state.loop ? 'Açık' : 'Kapalı';
          lp.classList.toggle('on', state.loop);
        }
      });
    }

    function loadPrefs() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p.text) {
          els.taD.value = p.text;
          els.taM.value = p.text;
        }
        if (p.speed != null) {
          state.speed = +p.speed;
          els.speed.value = String(state.speed);
        }
        if (p.theme) setTheme(p.theme, els.settingsRoot);
        if (p.mirror) setMirror(p.mirror, els.settingsRoot);
        if (p.band) setBand(p.band, els.settingsRoot);
        if (typeof p.countdown === 'boolean') state.countdownEnabled = p.countdown;
        if (typeof p.loop === 'boolean') state.loop = p.loop;
        if (p.font != null) {
          state.fontScale = +p.font;
          const r = els.settingsRoot.querySelector('[data-k="font"]');
          if (r) {
            r.value = String(p.font);
            document.documentElement.style.setProperty('--fz', 'calc(' + p.font + ' * clamp(22px, 2.35vw + 14px, 52px))');
          }
        }
        if (p.lh != null) {
          state.lineHeight = +p.lh;
          els.script.style.lineHeight = String(p.lh);
          const r = els.settingsRoot.querySelector('[data-k="lh"]');
          if (r) r.value = String(p.lh);
        }
        if (p.blur != null) {
          state.blurPx = +p.blur;
          document.documentElement.style.setProperty('--blur', p.blur + 'px');
          const r = els.settingsRoot.querySelector('[data-k="blur"]');
          if (r) r.value = String(p.blur);
        }
        if (p.vig != null) {
          const frac = p.vig > 1 ? p.vig / 100 : p.vig;
          state.vignette = frac;
          els.vignette.style.opacity = String(frac);
          const r = els.settingsRoot.querySelector('[data-k="vig"]');
          if (r) r.value = String(Math.round(frac * 100));
        }
        if (p.align) {
          els.script.style.textAlign = p.align;
          [els.settingsRoot, els.settingsMobile].forEach((root) => {
            root.querySelectorAll('[data-align]').forEach((x) => x.classList.toggle('on', x.dataset.align === p.align));
          });
        }
        if (p.face) {
          const map = { fr: '"Fraunces",Georgia,serif', dm: '"DM Sans",system-ui,sans-serif', mono: '"JetBrains Mono",monospace' };
          [els.settingsRoot, els.settingsMobile].forEach((root) => {
            const s = root.querySelector('[data-k="face"]');
            if (s) s.value = p.face;
          });
          els.script.style.fontFamily = map[p.face] || map.fr;
        }
        if (p.pip) state.pipCorner = p.pip;
        if (p.facing) state.facing = p.facing;
        if (p.audio === false) state.audioOn = false;
        if (p.camLayout === 'fill' || p.camLayout === 'pip') state.camLayout = p.camLayout;
        if (p.pipSizePct != null) state.pipSizePct = Math.max(15, Math.min(48, +p.pipSizePct));
        if (p.pipOpacity != null) state.pipOpacity = Math.max(0.15, Math.min(1, +p.pipOpacity));
        if (p.fillCamOpacity != null) state.fillCamOpacity = Math.max(0.05, Math.min(1, +p.fillCamOpacity));
        if (p.fillScrimOpacity != null) state.fillScrimOpacity = Math.max(0, Math.min(0.96, +p.fillScrimOpacity));
        if (p.fillTextGlow != null) state.fillTextGlow = Math.max(0, Math.min(1, +p.fillTextGlow));
        if (p.bandHeightPx != null) state.bandHeightPx = Math.max(56, Math.min(280, +p.bandHeightPx));
        if (p.lineThicknessPx != null) state.lineThicknessPx = Math.max(1, Math.min(12, +p.lineThicknessPx));
        if (p.bandFillOpacity != null) state.bandFillOpacity = Math.max(0.05, Math.min(1, +p.bandFillOpacity));
        const _setR = (k, val) => {
          const r = els.settingsRoot.querySelector('[data-k="' + k + '"]');
          if (r && val != null) r.value = String(val);
        };
        _setR('band-hpx', Math.round(state.bandHeightPx));
        _setR('line-th', state.lineThicknessPx);
        _setR('band-op', Math.round(state.bandFillOpacity * 100));
        syncPlaybackToggles();
        applyFocusChrome();
        syncCamPanelsFromState();
        applyCamVisuals();
        updateCamFlipHeadUi();
      } catch (e) {}
    }

    function bindGlobal() {
      els.btnPlay.addEventListener('click', togglePlay);
      els.btnReset.addEventListener('click', resetPlay);
      els.btnCamTop.addEventListener('click', toggleCam);
      els.btnRecTop.addEventListener('click', toggleRec);
      if (els.btnFlipHead)
        els.btnFlipHead.addEventListener('click', () => void flipCam());
      if (els.mobFlipFab)
        els.mobFlipFab.addEventListener('click', () => void flipCam());
      els.btnFs.addEventListener('click', goFullscreen);

      els.speed.addEventListener('input', () => {
        state.speed = +els.speed.value;
        updateWpmLabel();
        scheduleSave();
      });

      let progPointer = false;
      els.progBar.addEventListener('pointerdown', (e) => {
        progPointer = true;
        els.progBar.setPointerCapture(e.pointerId);
        seekClientX(e.clientX);
      });
      els.progBar.addEventListener('pointermove', (e) => {
        if (progPointer) seekClientX(e.clientX);
      });
      els.progBar.addEventListener('pointerup', (e) => {
        progPointer = false;
        try { els.progBar.releasePointerCapture(e.pointerId); } catch (x) {}
      });
      els.progBar.addEventListener('pointercancel', () => {
        progPointer = false;
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.closest('textarea') || e.target.closest('input')) return;
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'ArrowUp') {
          e.preventDefault();
          state.speed = Math.min(100, state.speed + 5);
          els.speed.value = String(state.speed);
          updateWpmLabel();
          scheduleSave();
        } else if (e.code === 'ArrowDown') {
          e.preventDefault();
          state.speed = Math.max(0, state.speed - 5);
          els.speed.value = String(state.speed);
          updateWpmLabel();
          scheduleSave();
        } else if (e.code === 'KeyV' && state.camOn) {
          e.preventDefault();
          void flipCam();
        } else if (e.code === 'KeyR') resetPlay();
        else if (e.code === 'KeyF') goFullscreen();
        else if (e.code === 'KeyC') toggleCam();
      });

      window.addEventListener('resize', () => requestAnimationFrame(updateMax));
      if (window.ResizeObserver) {
        new ResizeObserver(() => updateMax()).observe(els.track);
        new ResizeObserver(() => updateMax()).observe(els.viewport);
      }

      els.sheetBackdrop.addEventListener('click', closeSheets);
      $$('[data-close-sheet]').forEach((b) => b.addEventListener('click', closeSheets));

      els.mobileBar.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-sheet]');
        if (!btn) return;
        if (btn.dataset.sheet === 'cam') {
          buildCamPanel();
          openSheet('cam');
        } else openSheet(btn.dataset.sheet);
      });

      els.tabEditor.addEventListener('click', () => applyTab('editor'));
      els.tabPrompter.addEventListener('click', () => applyTab('prompter'));

      /* Manual scroll drag on stage while paused */
      els.stage.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.pip')) return;
        if (e.target.closest('.cam-switch-fab')) return;
        if (state.playing || state.countdown) return;
        state.manualDrag = true;
        state.dragStartY = e.clientY;
        state.dragStartPos = state.pos;
        els.stage.setPointerCapture(e.pointerId);
      });
      els.stage.addEventListener('pointermove', (e) => {
        if (!state.manualDrag) return;
        const dy = e.clientY - state.dragStartY;
        setPos(state.dragStartPos - dy);
      });
      els.stage.addEventListener('pointerup', endDrag);
      els.stage.addEventListener('pointercancel', endDrag);

      /* Pinch resize font */
      let pinchDist = null;
      els.stage.addEventListener(
        'touchstart',
        (e) => {
          if (e.touches.length === 2)
            pinchDist = Math.hypot(
              e.touches[1].clientX - e.touches[0].clientX,
              e.touches[1].clientY - e.touches[0].clientY,
            );
        },
        { passive: true },
      );
      els.stage.addEventListener(
        'touchmove',
        (e) => {
          if (e.touches.length !== 2 || pinchDist == null) return;
          const d = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
          const ratio = d / pinchDist;
          if (Math.abs(ratio - 1) < 0.03) return;
          const base = els.settingsRoot.querySelector('[data-k="font"]');
          if (!base) return;
          let nv = parseFloat(base.value) * ratio;
          nv = Math.max(0.65, Math.min(1.65, Math.round(nv * 100) / 100));
          const sv = String(nv);
          $$('#settings-root [data-k="font"], #settings-mobile [data-k="font"]').forEach((sl) => {
            sl.value = sv;
            sl.dispatchEvent(new Event('input', { bubbles: true }));
          });
          pinchDist = d;
        },
        { passive: true },
      );
      els.stage.addEventListener('touchend', () => { pinchDist = null; }, { passive: true });
    }

    function endDrag(e) {
      state.manualDrag = false;
      try {
        if (e && e.pointerId != null) els.stage.releasePointerCapture(e.pointerId);
      } catch (x) {}
    }

    function syncParallelAfterLoad() {
      [els.settingsRoot, els.settingsMobile].forEach((p) => {
        const face = els.settingsRoot.querySelector('[data-k="face"]');
        const fm = p.querySelector('[data-k="face"]');
        if (face && fm && fm !== face) fm.value = face.value;
        ['font', 'lh', 'blur', 'vig', 'band-hpx', 'line-th', 'band-op'].forEach((k) => {
          const a = els.settingsRoot.querySelector('[data-k="' + k + '"]');
          const b = p.querySelector('[data-k="' + k + '"]');
          if (a && b && a !== b) {
            b.value = a.value;
            b.dispatchEvent(new Event('input'));
          }
        });
      });
    }

    if (prefersReduceMotion()) els.body.classList.add('reduce-motion');

    initSettingsUi();
    bindTextareas();
    bindGlobal();
    loadPrefs();
    syncParallelAfterLoad();
    syncText();
    updateWpmLabel();
    requestAnimationFrame(updateMax);
    applyFocusChrome();
    syncCamPanelsFromState();
    applyCamVisuals();
    updateCamFlipHeadUi();
    buildCamPanel();
    applyTab(window.matchMedia('(max-width:820px)').matches ? 'prompter' : 'editor');
  })();
  </script>
</body>
</html>
